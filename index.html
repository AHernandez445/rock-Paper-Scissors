<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="logic.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
    <body>
        <div class="bigger-container">
            <div class="container">
                <div class= "rps" id="rock">
                    <img class="rockImage" src="https://m.media-amazon.com/images/I/61W8BVTF10L._AC_UF894,1000_QL80_.jpg" alt="image of a rock">
                </div>

                <div class= "rps" id="paper">
                    <img class="paperImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQXOWLU44KmDFIFyT_i6a3QWX4XjuKKbX0KWw5e2_7mrA&s=10" alt="image of paper">
                </div>

                <div class= "rps" id="scissors">
                    <img class="scissorImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBoXJSq2uHggfvB3HaFeVFl-66wRd-b3cgssqbHrg4pg&s=10" alt="image of Scissors">
                </div>
            </div>

            <div class="container-two">
                <div id = "output"></div>
                <p id = "finalWinner"></p>
            </div>
        </div>
    </body>
</html>
